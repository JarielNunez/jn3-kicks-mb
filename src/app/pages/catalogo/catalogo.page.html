<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Catálogo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="refrescar($event)">
  <ion-refresher-content
    pullingText="Desliza para ver pares nuevos"
    refreshingSpinner="crescent"
    refreshingText="Buscando...">
  </ion-refresher-content>
</ion-refresher>
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Catálogo</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class ="grilla">
  @for (p of productos; track p.id) {
    <ion-card [routerLink]="['/detalle', p.id]">
      <img [src]="p.imagen" [alt]="p.nombre" />
      <ion-card-header>
        <ion-card-subtitle>ORIGINAL GARANTIZADO</ion-card-subtitle>
        <ion-card-title>{{ p.nombre }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>RD$ {{ p.precio | number }}</ion-card-content>
    </ion-card>
  }
  </div>
</ion-content>
